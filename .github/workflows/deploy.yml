name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'Kod.js'
      - 'index.html'
      - 'appsscript.json'
      - '.clasp.json'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: echo "${{ secrets.CLASPRC_JSON_B64 }}" | base64 -d > ~/.clasprc.json

      - name: Push to Apps Script
        run: |
          set +e
          OUT=$(clasp push --force 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            SAFE=$(echo "$OUT" | tr '\n' ' ' | head -c 900)
            echo "::error::CLASP_PUSH_FAILED: $SAFE"
            exit 1
          fi
