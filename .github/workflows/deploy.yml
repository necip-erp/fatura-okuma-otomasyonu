name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'Kod.js'
      - 'index.html'
      - 'appsscript.json'
      - '.clasp.json'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: echo "${{ secrets.CLASPRC_JSON_B64 }}" | base64 -d > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push --force

      - name: Deploy (sabit deploymentId'ye guncelle)
        run: clasp deploy -i AKfycbysou4qEnAXeT1YFAuycdj3EA-eZ6alGlbHwQYe5SqmCq8jZCjJq2JGRYnyoTKk7VH9 --description "Auto-deploy from GitHub $(date +'%Y-%m-%d %H:%M')"
